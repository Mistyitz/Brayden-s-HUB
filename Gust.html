<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Link</title>
    <!-- Tailwind CSS for clean dark styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="text-center bg-slate-800/80 border border-slate-700/60 rounded-2xl p-8 sm:p-12 shadow-2xl backdrop-blur-sm max-w-md w-full">
        <h1 class="text-2xl font-semibold text-white mb-2">Launcher</h1>
        <p class="text-sm text-slate-400 mb-6">Click the button below to launch the site in an about:blank tab.</p>
        
        <!-- SINGLE BUTTON -->
        <button id="openBtn" onclick="openInBlank()" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl shadow-lg hover:shadow-indigo-500/25 transition-all text-base focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-900">
            Open in blank tab
        </button>
    </div>

    <script>
        /* ==========================================================================
           CONFIGURABLE URL:
           Change the target URL below whenever you want to open something else!
           ========================================================================== */
        const TARGET_URL = "https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/svg/site.svg";

        function openInBlank() {
            // Open a new window set to about:blank
            const win = window.open('about:blank', '_blank');
            
            if (!win) {
                alert('Pop-up was blocked! Please allow pop-ups for this site.');
                return;
            }

            // Set up a full-screen iframe inside the about:blank window
            const doc = win.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;">
                <head>
                    <title>Classes</title>
                    <style>
                        body {
                            margin: 0;
                            padding: 0;
                            width: 100vw;
                            height: 100vh;
                            background-color: #000;
                            overflow: hidden;
                        }
                        iframe {
                            border: none;
                            width: 100%;
                            height: 100%;
                            display: block;
                        }
                    </style>
                </head>
                <body>
                    <iframe src="${TARGET_URL}" allowfullscreen="true"></iframe>
                </body>
                </html>
            `);
            doc.close();
        }
    </script>
</body>
</html>
